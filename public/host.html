<!doctype html><meta charset=utf-8><title>Monster Review</title>
<style>
body{margin:0;background:#1b1f3b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#ui>*{pointer-events:auto}
button,select{font-size:1.4rem;padding:.5em 1em;border-radius:12px;border:0;margin:.3em}
button{background:#ffd43b;cursor:pointer;font-weight:700}
#bn{position:fixed;top:14px;width:100%;text-align:center;font-size:2.4rem;font-weight:800;text-shadow:0 2px 6px #000}
</style>
<canvas id=c></canvas><div id=bn></div><div id=ui></div>
<script src=/socket.io/socket.io.js></script>
<script>
const s=io(),c=document.getElementById('c'),x=c.getContext('2d'),ui=document.getElementById('ui'),bn=document.getElementById('bn');
let S={phase:'lobby',teams:[],np:0},pos={},W,H,last=0;
const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();onresize=size;
s.emit('host');
s.on('state',st=>{const ph=S.phase;S=st;if(ph!=st.phase||st.phase=='lobby')ui_()});
s.on('eat',e=>{const h=pos[e.h],p=pos[e.p];if(!h||!p)return;h.chase=e.p;h.t=e.win?2.5:1.2;
 if(e.win){p.dying=true;p.ghost=S.teams.find(t=>t.id==e.p)}
 bn.textContent=e.win?`${e.hn} ate ${e.pn}!`:`${e.pn} escaped ${e.hn}!`;setTimeout(()=>bn.textContent='',3500)});
function ui_(){
 if(S.phase=='lobby')ui.innerHTML=`<h1 style="font-size:4rem">Monster Review</h1><p style="font-size:2rem">Students go to:<br><b>${location.host}/play.html</b></p><p style="font-size:2rem">${S.np} players joined</p><div>Teams <select id=n>${[2,3,4,5,6,8].map(k=>`<option ${k==4?'selected':''}>${k}</option>`).join('')}</select><button onclick="s.emit('start',+n.value)">Start</button></div>`;
 else if(S.phase=='done')ui.innerHTML=`<h1 style="font-size:4rem">🏆 ${S.teams[0].name} wins!</h1><button onclick="s.emit('reset')">New round</button>`;
 else ui.innerHTML=''}
const rad=t=>Math.min(H*.33,24*Math.sqrt(t.mass));
function P(t){return pos[t.id]||(pos[t.id]={x:W*(.15+Math.random()*.7),y:H*(.3+Math.random()*.55),vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,r:10,ph:Math.random()*9})}
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;x.clearRect(0,0,W,H);
 if(S.phase=='lobby')pos={};
 const all=S.teams.slice();
 for(const id in pos)if(pos[id].dying&&!all.find(t=>t.id==id))all.push(pos[id].ghost);
 for(const t of all){const p=P(t);p.r+=(rad(t)-p.r)*dt*3;
  if(p.chase&&pos[p.chase]){const q=pos[p.chase],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;
   p.x+=dx/d*320*dt;p.y+=dy/d*320*dt;p.t-=dt;
   if(d<p.r*.5||p.t<0){if(q.dying)delete pos[p.chase];p.chase=null;p.vx=(Math.random()-.5)*60;p.vy=(Math.random()-.5)*60}}
  else if(!p.dying){p.vx+=(Math.random()-.5)*40*dt;p.vy+=(Math.random()-.5)*40*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   if(p.x<p.r||p.x>W-p.r)p.vx*=-1;if(p.y<p.r+70||p.y>H-p.r)p.vy*=-1;
   p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r+70,Math.min(H-p.r,p.y))}
  x.globalAlpha=p.dying?.65:1;x.fillStyle=t.color;x.beginPath();
  for(let a=0;a<=6.5;a+=.2){const r=p.r*(1+.06*Math.sin(a*5+ts/300+p.ph));x[a?'lineTo':'moveTo'](p.x+Math.cos(a)*r,p.y+Math.sin(a)*r)}
  x.fill();x.fillStyle='#fff';
  for(const e of[-.3,.3]){x.beginPath();x.arc(p.x+e*p.r,p.y-p.r*.2,p.r*.17,0,7);x.fill()}
  x.fillStyle='#222';for(const e of[-.3,.3]){x.beginPath();x.arc(p.x+e*p.r,p.y-p.r*.18,p.r*.08,0,7);x.fill()}
  x.globalAlpha=1;x.fillStyle='#fff';x.textAlign='center';x.font='bold 24px system-ui';
  x.fillText(`${t.name} (${t.n})`,p.x,p.y+p.r+28);
  if(!p.dying){x.fillStyle='#0006';x.fillRect(p.x-50,p.y-p.r-22,100,10);x.fillStyle=t.hunting?'#ffd43b':'#fff';x.fillRect(p.x-50,p.y-p.r-22,100*t.progress/t.target,10);
   if(t.hunting)x.fillText('HUNTING!',p.x,p.y-p.r-30)}}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);ui_();
</script>
